<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recurso Multimedia - Diseño de Interiores</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .video-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            text-align: center;
        }

        iframe {
            border-radius: 8px;
            max-width: 100%;
        }

        .info-autor {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .autor-tag {
            font-weight: bold;
            color: #d35400; /* Color distintivo para el autor */
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #7f8c8d;
            text-align: center;
        }

        footer a {
            color: #2980b9;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="video-card">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/ebhLM0CAqfE?si=1drTxx4daPjf2Xf8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        
        <p class="info-autor">Video producido por: <span class="autor-tag">@china_grion</span></p>
    </div>

    <footer>
        <p>Este material se distribuye bajo la licencia:<br>
            <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="license">
                Creative Commons Atribución-CompartirIgual 4.0 Internacional (CC BY-SA 4.0)
            </a>
        </p>
    </footer>

</body>
</html>
